name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # Download the Electron binary once, up front: otherwise both test workers download it at the
      # same moment and the first test can launch a half-written binary.
      - name: Download the Electron binary
        run: pnpm --filter @tapestry/app exec node node_modules/electron/install.js
      - name: End-to-end smoke test (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      - name: End-to-end smoke test
        if: runner.os != 'Linux'
        run: pnpm test:e2e

  typescript-7:
    name: TypeScript 7 readiness (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:ts7
