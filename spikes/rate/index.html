<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rate the shots</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --card: #fff;
        --ink: #1d2330;
        --muted: #5b6475;
        --line: #d9d5ca;
        --accent: #1f7a8c;
        --accent-ink: #fff;
        --good: #2b7a4b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171f;
          --card: #1d2230;
          --ink: #eef0f5;
          --muted: #a4adbf;
          --line: #343b4d;
          --accent: #4fb3c4;
          --accent-ink: #0d1a1e;
          --good: #5cc488;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          17px/1.45 system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 16px 80px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      .muted {
        color: var(--muted);
      }
      .bar {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .grow {
        flex: 1;
      }
      button,
      input[type='text'],
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        min-height: 44px;
        padding: 6px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        cursor: pointer;
      }
      button.primary,
      button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      video {
        width: 100%;
        border-radius: 10px;
        background: #000;
      }
      .question {
        margin: 12px 0 0;
      }
      .scale {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .scale button {
        flex: 1;
        min-width: 44px;
      }
      .ends {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: var(--muted);
      }
      textarea,
      input[type='text'] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
      }
      .saved {
        color: var(--good);
      }
      .prompt {
        font-style: italic;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>Rate the shots</h1>
      <p class="muted">Loading…</p>
    </main>
    <script type="module" src="./rate.js"></script>
  </body>
</html>
