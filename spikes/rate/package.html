<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Score the clips</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --card: #fff;
        --ink: #1d2330;
        --muted: #5b6475;
        --line: #d9d5ca;
        --accent: #1f7a8c;
        --accent-ink: #fff;
        --good: #2b7a4b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171f;
          --card: #1d2230;
          --ink: #eef0f5;
          --muted: #a4adbf;
          --line: #343b4d;
          --accent: #4fb3c4;
          --accent-ink: #0d1a1e;
          --good: #5cc488;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          17px/1.45 system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 16px 80px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 21px;
        margin: 28px 0 4px;
      }
      .muted {
        color: var(--muted);
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 0;
        background: var(--bg);
      }
      .grow {
        flex: 1;
      }
      button,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        min-height: 44px;
        padding: 6px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      button:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .card h3 {
        font-size: 15px;
        margin: 0 0 8px;
        word-break: break-all;
        font-weight: 600;
      }
      video,
      img {
        width: 100%;
        border-radius: 10px;
        background: #000;
      }
      audio {
        width: 100%;
      }
      .scale {
        display: flex;
        gap: 6px;
        margin: 10px 0 6px;
      }
      .scale button {
        flex: 1;
        min-width: 44px;
      }
      .ends {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: var(--muted);
      }
      textarea {
        width: 100%;
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
      }
      details {
        margin: 8px 0;
      }
      pre {
        white-space: pre-wrap;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        font-size: 15px;
      }
      .refs {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin: 8px 0 0;
      }
      .refs figure {
        margin: 0;
        text-align: center;
        font-size: 13px;
      }
      .refs img {
        width: 64px;
        height: 64px;
        object-fit: cover;
        border-radius: 8px;
      }
      .saved {
        color: var(--good);
      }
      .prompt {
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>Score the clips</h1>
      <p class="muted">Loading…</p>
    </main>
    <script type="module" src="./package.js"></script>
  </body>
</html>
